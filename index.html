<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Login Clone</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <img class="google-logo" src="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_92x30dp.png" alt="Google Logo">
        <h2>Sign in</h2>
        <p>Use your Google Account</p>
        <input type="email" class="input-field" placeholder="Email or phone">
        <input type="password" class="input-field" placeholder="Password">
        <button class="signin-button">Sign In</button>
    </div>
</body>
</html>
